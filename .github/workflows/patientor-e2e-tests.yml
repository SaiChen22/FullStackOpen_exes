name: Patientor E2E Tests

on:
  push:
    branches: [main, master]
    paths:
      - "part9/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # 1. 添加 pnpm 安装步骤
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # 2. 修改后端依赖安装
      - name: Install patientor backend dependencies
        working-directory: ./part9/fs-typescript/patientor/backend
        run: pnpm install

      # 3. 修改前端依赖安装（如果适用）
      - name: Install patientor frontend dependencies
        working-directory: ./part9/fs-typescript/patientor
        run: pnpm install

    # 4. 修改 E2E / API 测试依赖安装与运行
      - name: Install E2E test dependencies
        working-directory: ./part9/fs-typescript/patientor-api-tests
        run: pnpm install

      - name: Install patientor backend dependencies
        working-directory: ./part9/fs-typescript/patientor/backend
        run: pnpm install --legacy-peer-deps

      - name: Start patientor backend
        working-directory: ./part9/fs-typescript/patientor/backend
        run: pnpm start &

      - name: Install patientor frontend dependencies
        working-directory: ./part9/fs-typescript/patientor/frontend
        run: pnpm install --legacy-peer-deps

      - name: Build patientor frontend
        working-directory: ./part9/fs-typescript/patientor/frontend
        run: pnpm run build

      - name: Start patientor frontend preview
        working-directory: ./part9/fs-typescript/patientor/frontend
        run: npx vite preview --port 5173 &

      - name: Install E2E test dependencies
        working-directory: ./part9/fs-typescript/patientor-tests
        run: npm install

      - name: Install Playwright browsers
        working-directory: ./part9/fs-typescript/patientor-tests
        run: npx playwright install --with-deps chromium

      - name: Wait for servers
        run: npx wait-on http://localhost:3001/api/ping http://localhost:5173 --timeout 60000

      - name: Run E2E tests
        working-directory: ./part9/fs-typescript/patientor-tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: part9/fs-typescript/patientor-tests/playwright-report/
          retention-days: 30