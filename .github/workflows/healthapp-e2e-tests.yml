name: Health app E2E Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'part9/fs-typescript/healthapp/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install healthapp dependencies
        run: |
          cd part9/fs-typescript/healthapp
          npm install --legacy-peer-deps

      - name: Lint healthapp
        run: |
          cd part9/fs-typescript/healthapp
          npm run lint

      - name: Start healthapp server in background
        run: |
          cd part9/fs-typescript/healthapp
          npm start &
          # 循环检测 3000 端口直到服务就绪（最多等待 30 秒）
          for i in {1..30}; do
            if nc -z 127.0.0.1 3000 || nc -z ::1 3000; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server..."
            sleep 1
          done

      - name: Install test dependencies and Playwright browsers
        run: |
          cd part9/fs-typescript/healthapp-tests
          npm install --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          cd part9/fs-typescript/healthapp-tests
          npm test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: part9/fs-typescript/healthapp-tests/playwright-report/
          retention-days: 30