name: Health app E2E Tests

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install healthapp dependencies
        run: |
          cd part9/fs-typescript/healthapp
          npm install

      - name: Lint healthapp
        run: |
          cd part9/fs-typescript/healthapp
          npm run lint

      - name: Start healthapp server in background
        run: |
          cd part9/fs-typescript/healthapp
          npm start &
          sleep 5

      - name: Install test dependencies and Playwright browsers
        run: |
          cd part9/fs-typescript/healthapp-tests
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          cd part9/fs-typescript/healthapp-tests
          npm test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: part9/fs-typescript/healthapp-tests/playwright-report/
          retention-days: 30