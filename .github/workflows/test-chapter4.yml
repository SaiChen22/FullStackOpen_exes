name: Test Chapter 4

on:
  push:
    branches: [main, master]
    paths:
      - 'part8/fs-graphql/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd part8/fs-graphql/library-backend
          npm install

      - name: Install test dependencies and run tests
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key
        run: |
          cd part8/fs-graphql/tests-chapter4
          npm install
          npm test