name: Patientor API Tests

on:
  workflow_dispatch:

  push:
    branches: [ xmain, xmaster ]
    paths:
      - 'part9/fs-typescript/patientor-api-tests/**'
      - 'part9/fs-typescript/patientor/backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    # 1. 添加 pnpm 安装步骤
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    # 2. 修改后端依赖安装与脚本执行命令
    - name: Install patientor backend dependencies
      working-directory: ./part9/fs-typescript/patientor/backend
      run: pnpm install

    - name: Lint patientor backend
      working-directory: ./part9/fs-typescript/patientor/backend
      run: pnpm run lint

    - name: Start patientor backend server
      working-directory: ./part9/fs-typescript/patientor/backend
      run: |
        pnpm start &
        echo $! > server.pid
        sleep 3

    # 3. 修改测试依赖安装与脚本执行命令
    - name: Install test dependencies
      working-directory: ./part9/fs-typescript/patientor-api-tests
      run: pnpm install

    - name: Install Playwright browsers
      working-directory: ./part9/fs-typescript/patientor-api-tests
      run: pnpm exec playwright install --with-deps chromium

    - name: Run API tests
      working-directory: ./part9/fs-typescript/patientor-api-tests
      run: pnpm test

    - name: Upload test report
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: playwright-report
        path: part9/fs-typescript/patientor-api-tests/playwright-report/
        retention-days: 30

    - name: Stop patientor backend server
      if: always()
      working-directory: ./part9/fs-typescript/patientor/backend
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
        fi