name: Test Chapter 5

on:
  push:
    branches: [main, master]
    paths:
      - 'part8/fs-graphql/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd part8/fs-graphql/library-backend
          npm install

      - name: Install frontend dependencies
        run: |
          cd part8/fs-graphql/library-frontend
          npm install

      - name: Install test dependencies & Playwright Browsers
        run: |
          cd part8/fs-graphql/tests-chapter5
          npm install
          npx playwright install --with-deps chromium

      - name: Run Chapter 5 E2E Tests
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key
        run: |
          cd part8/fs-graphql/tests-chapter5
          npm test